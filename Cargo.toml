[package]
name = "rasuti-notes"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "A server-side rendered Markdown notes application in Rust"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["fs"] }
maud = "0.26"
pulldown-cmark = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
thiserror = "1"
percent-encoding = "2"
clap = { version = "4", features = ["derive"] }
