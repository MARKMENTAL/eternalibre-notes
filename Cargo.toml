[package]
name = "eternalibre-notes"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "EternaLibre Notes - a server-side rendered, copyleft Markdown notes application"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
maud = "0.26"
pulldown-cmark = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
thiserror = "1"
percent-encoding = "2"
clap = { version = "4", features = ["derive"] }
syntect = "5"
totp-rs = { version = "6.0.0", features = ["gen_secret", "otpauth"] }
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
rand = "0.10.3"

[dev-dependencies]
# Integration tests drive the router via `oneshot`.
tower = { version = "0.5", features = ["util"] }
